[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-generative-benchmark"
version = "1.0.0"
description = "Benchmark for generative modelling of E. coli core kinetic parameters (Km)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["numpy", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
include = ["benchmark*"]
